# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

reviews:
  profile: quiet

  # Keep the PR clean: disable non-essential walkthrough content.
  high_level_summary: false
  review_status: false
  review_details: false

  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false

  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false

  request_changes_workflow: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 20
    drafts: false

  path_instructions:
    - path: "**/*"
      instructions: |
        This repository is a long-lived fork.

        The target branch "personal" contains intentional personal
        modifications maintained on top of upstream/main.

        For pull requests from "sync/upstream" to "personal",
        focus only on actionable integration risks introduced by
        upstream changes.

        Look specifically for:
        - upstream API changes that break personal modifications
        - renamed or removed APIs still referenced by personal code
        - behavioral changes that Git merge does not detect
        - configuration schema changes
        - personal behavior accidentally removed by upstream changes
        - subtle semantic conflicts even when Git reports no conflict
        - upstream changes that make existing personal patches redundant
          or obsolete

        Only report findings that are likely to require human attention.

        Do not report:
        - formatting or style preferences
        - naming suggestions
        - optional refactors
        - documentation improvements
        - speculative improvements
        - generic best-practice advice
        - cosmetic or low-impact issues

        Be concise and direct.
        Prefer review comments and explanations in English.

        Do not recommend rebasing this branch.
