name: Personal release

on:
  push:
    branches: [personal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-release
  cancel-in-progress: false

env:
  CARGO_BUILD_TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    if: github.ref == 'refs/heads/personal'
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore release caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\codexbar-release\cache\cargo-target
            ${{ runner.temp }}\codexbar-release\cache\cargo-target-cli
            ${{ runner.temp }}\codexbar-release\cache\pnpm-store
            ${{ runner.temp }}\codexbar-release\cache\installer-deps
          key: personal-release-${{ hashFiles('Cargo.lock', 'apps/desktop-tauri/pnpm-lock.yaml') }}
          restore-keys: personal-release-

      - name: Build installer and portable app
        shell: powershell
        run: |
          ./scripts/windows-release-build.ps1 `
            -Ref $env:GITHUB_SHA `
            -RepoUrl $env:GITHUB_WORKSPACE `
            -WorkRoot "$env:RUNNER_TEMP\codexbar-release"

      - name: Store release assets
        uses: actions/upload-artifact@v4
        with:
          name: personal-release-assets
          path: ${{ runner.temp }}\codexbar-release\assets\CodexBar-*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: personal-release-assets
          path: release-assets

      - name: Replace rolling personal release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          trap {
            $message = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Output "::error title=Personal release::$message"
            exit 1
          }

          function Stop-Publish([string]$Message) {
            Write-Output "::error title=Personal release::$Message"
            throw $Message
          }

          function Remove-Staging([string]$Tag) {
            try { gh release delete $Tag --cleanup-tag --yes 2>$null } catch {}
            try {
              gh api --method DELETE `
                "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$Tag" 2>$null
            } catch {}
            $global:LASTEXITCODE = 0
          }

          $assets = @(Get-ChildItem "$env:GITHUB_WORKSPACE\release-assets\CodexBar-*" -File |
            Where-Object Name -Match '^(CodexBar-.+-(Setup|portable)\.exe)(\.sha256)?$' |
            ForEach-Object FullName)
          if ($assets.Count -ne 4) { Stop-Publish "Expected four release assets, found $($assets.Count)." }

          $personalHead = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/personal" --jq '.object.sha' 2>&1
          if ($LASTEXITCODE -ne 0) { Stop-Publish "Could not read the current personal branch head: $personalHead" }
          if ($personalHead -ne $env:GITHUB_SHA) {
            Write-Host "Skipping stale build $env:GITHUB_SHA; personal is now $personalHead."
            exit 0
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $stagingTag = "personal-staging-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $backupTag = "personal-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $title = "Personal build ($shortSha)"
          $notes = "Automated build of the personal branch at commit $env:GITHUB_SHA."

          $stageOutput = gh release create $stagingTag @assets `
            --target $env:GITHUB_SHA `
            --title "Staging $title" `
            --notes $notes `
            --prerelease `
            --latest=false 2>&1
          if ($LASTEXITCODE -ne 0) {
            Remove-Staging $stagingTag
            Stop-Publish "Could not stage the personal release: $stageOutput"
          }

          $stagedNames = @(gh release view $stagingTag --json assets --jq '.assets[].name' 2>&1)
          $stagedViewExit = $LASTEXITCODE
          if ($stagedViewExit -ne 0 -or $stagedNames.Count -ne 4) {
            Remove-Staging $stagingTag
            Stop-Publish "Staged release verification failed (exit $stagedViewExit): $($stagedNames -join ' ')"
          }

          $personalHead = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/personal" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not recheck the personal branch head.' }
          if ($personalHead -ne $env:GITHUB_SHA) {
            gh release delete $stagingTag --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove a stale staged release.' }
            Write-Host "Skipping stale build $env:GITHUB_SHA; personal is now $personalHead."
            exit 0
          }

          gh release view personal-latest *> $null
          $hadPreviousRelease = $LASTEXITCODE -eq 0
          $previousTagSha = gh api `
            "repos/$env:GITHUB_REPOSITORY/git/ref/tags/personal-latest" `
            --jq '.object.sha' 2>$null
          $hadPreviousTag = $LASTEXITCODE -eq 0
          if ($hadPreviousRelease) {
            gh release edit personal-latest --tag $backupTag --target $personalHead
            if ($LASTEXITCODE -ne 0) { throw 'Could not preserve the previous personal release.' }
          }

          gh release edit $stagingTag `
            --tag personal-latest `
            --target $personalHead `
            --title $title `
            --notes $notes `
            --prerelease `
            --latest=false
          if ($LASTEXITCODE -ne 0) {
            if ($hadPreviousRelease) {
              gh release edit $backupTag --tag personal-latest --target $personalHead
              if ($LASTEXITCODE -ne 0) { throw 'Could not restore the previous personal release.' }
            }
            throw 'Could not promote the staged personal release.'
          }

          if ($hadPreviousTag) {
            gh api --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/git/refs/tags/personal-latest" `
              -f "sha=$env:GITHUB_SHA" `
              -F force=true *> $null
          } else {
            gh api --method POST `
              "repos/$env:GITHUB_REPOSITORY/git/refs" `
              -f 'ref=refs/tags/personal-latest' `
              -f "sha=$env:GITHUB_SHA" *> $null
          }
          $tagMoved = $LASTEXITCODE -eq 0
          if (-not $tagMoved) {
            $observedTagSha = gh api `
              "repos/$env:GITHUB_REPOSITORY/git/ref/tags/personal-latest" `
              --jq '.object.sha' 2>$null
            $tagMoved = $LASTEXITCODE -eq 0 -and $observedTagSha -eq $env:GITHUB_SHA
          }
          if (-not $tagMoved) {
            gh release edit personal-latest --tag $stagingTag --target $personalHead
            if ($LASTEXITCODE -ne 0) { throw 'Tag move failed and the staged release rollback also failed.' }
            if ($hadPreviousRelease) {
              gh release edit $backupTag --tag personal-latest --target $personalHead
              if ($LASTEXITCODE -ne 0) { throw 'Tag move failed and the previous release rollback also failed.' }
            }
            if ($hadPreviousTag) {
              gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/personal-latest" *> $null
              if ($LASTEXITCODE -eq 0) {
                gh api --method PATCH `
                  "repos/$env:GITHUB_REPOSITORY/git/refs/tags/personal-latest" `
                  -f "sha=$previousTagSha" `
                  -F force=true *> $null
              } else {
                gh api --method POST `
                  "repos/$env:GITHUB_REPOSITORY/git/refs" `
                  -f 'ref=refs/tags/personal-latest' `
                  -f "sha=$previousTagSha" *> $null
              }
              if ($LASTEXITCODE -ne 0) { throw 'Could not restore the previous personal tag.' }
            } else {
              $deleteOutput = gh api --method DELETE `
                "repos/$env:GITHUB_REPOSITORY/git/refs/tags/personal-latest" 2>&1
              if ($LASTEXITCODE -ne 0 -and "$deleteOutput" -notmatch 'HTTP 404') {
                throw "Could not remove the partially created personal tag: $deleteOutput"
              }
            }
            throw 'Could not move the personal release tag.'
          }

          gh api --method DELETE `
            "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$stagingTag" 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Warning "Could not remove staging tag $stagingTag." }
          if ($hadPreviousRelease) {
            gh release delete $backupTag --yes
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove the superseded personal release.' }
          }
          Write-Host "Published personal-latest at $env:GITHUB_SHA."
          exit 0
